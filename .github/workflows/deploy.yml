name: CI/CD with Self-Hosted Runner

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v3

      - name: Cài dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to production
        run: |
          # Chỉ xóa nội dung cũ, không xóa thư mục gốc
          rm -rf /projects/FaceBugFE/*
          mkdir -p /projects/FaceBugFE

          # Copy build
          cp -r dist/* /projects/FaceBugFE/

          # Kiểm tra Nginx config trước khi reload
          sudo nginx -t

          # Reload Nginx để React app live
          sudo systemctl reload nginx
